      - generic ethics essay without AI lab or policy actor
      - religion unrelated to AI
      - personal opinion without primary source
      - culture-war commentary without source text
      - safety marketing without public authority or governance text
    timeline: trend/ai-governance-legitimacy.md
    report_section: AI Governance Legitimacy

