  - id: claude-tag-identity
    label: Claude Tag Identity
    enabled: true
    description: >
      Tracks Claude Tag and adjacent team-wide agent identity patterns:
      workspace-scoped agent accounts, Slack/channel participation, admin
      configured tool access, shared-context delegation, auditability, and the
      boundary between acting as one user versus acting as an autonomous team
      member.
    why_watch: >
      Claude Tag shifts Claude from a single-user assistant toward an agent
      that participates in shared team spaces with its own identity and
      workspace-managed permissions. That can become a durable enterprise
      pattern for how agents get accounts, access tools, inherit context, and
      remain governable inside organizations.
    include_keywords:
