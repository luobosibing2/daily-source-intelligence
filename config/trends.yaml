  - id: codex-claude-usage-tactics
    label: Codex & Claude Code Usage Tactics
    enabled: true
    description: >
      Tracks reusable usage tactics for OpenAI Codex and Claude Code: prompt
      framing, bug-hunting prompts, review workflows, repo-local decision
      memory, ADRs for agents, AGENTS.md / skills / rules usage, long-task
      delegation, thread/session orchestration, computer-use supervision, and
      other concrete operator practices. The focus is how to use the tools
      better, not which product feature shipped.
    why_watch: >
      As Codex and Claude Code become long-running agent runtimes, advantage
      shifts from raw model choice to operator technique: how users frame
      tasks, preserve project judgment, trigger reviews, supervise background
      work, manage multiple threads, and avoid amplifying low-quality output.
      Official guidance and high-quality practitioner notes can become durable
      playbooks.
