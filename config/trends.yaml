      - managed network proxy
      - remote compaction
      - exec-server websocket
      - Codex package
      - DotSlash
    exclude_keywords:
      - Codex Alimentarius
      - manuscript codex
      - ancient codex
      - game codex
      - codec
      - coding challenge named codex but unrelated to OpenAI
      - OpenAI model release without Codex product changes
      - ChatGPT feature unrelated to Codex
    timeline: trend/codex-feature-watch.md
    report_section: Codex Feature Watch

  - id: ai-governance-legitimacy
    label: AI Governance Legitimacy
    enabled: true
    description: >
      Tracks AI labs, frontier-model leaders, and core technical figures when
      they enter public-authority, policy, religious, legal, standards, or
      high-impact governance texts. The focus is legitimacy, public trust,
      societal framing, and governance influence, not generic AI ethics essays.
    why_watch: >
      Frontier AI products are increasingly shaped by public legitimacy and
      institutional trust. Signals like a lab co-founder participating in a
      Vatican encyclical launch can reframe model limits, human dignity,
      labor, accountability, and public-good claims outside ordinary product
      marketing or engineering release notes.
    include_keywords:
      - AI governance
      - AI ethics
      - public trust
      - public legitimacy
      - frontier AI
      - AI policy
      - AI regulation
      - regulator
      - government
      - Vatican
      - Pope
      - encyclical
