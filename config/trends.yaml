      - Deltas
      - Echo
      - customer environment
      - onsite
    exclude_keywords:
      - full disk encryption
      - disk encryption
      - finite difference equation
      - job board only
      - hiring only
      - generic job posting
      - military deployment unrelated to software
      - consulting pitch without product feedback loop
    timeline: trend/forward-deployed-engineering.md
    report_section: Forward Deployed Engineering

  - id: enterprise-delivery-system
    label: Enterprise Delivery System
    enabled: true
    description: >
      Tracks AI agents moving from individual coding helpers into enterprise
      delivery systems: SDLC throughput, launch readiness, test/review gates,
      legacy modernization, data/application prototyping, internal tools,
      release governance, auditability, human approval, and cross-team handoffs.
    why_watch: >
      When agents accelerate local coding and prototyping, the bottleneck often
      moves to organizational absorption: backend/API readiness, central data
      queues, QA, security review, production rollout, governance controls,
      ownership, and measurement. This trend watches whether vendors and users
      are packaging agents as delivery infrastructure rather than personal
      productivity tools.
