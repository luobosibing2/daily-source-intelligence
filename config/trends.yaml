  - id: codex-feature-watch
    label: Codex Feature Watch
    enabled: true
    description: >
      Tracks which OpenAI Codex features are being added or hardened across
      CLI, TUI, SDK, app-server, goals, profiles, permissions, sandboxing, MCP,
      plugins, extensions, hooks, remote-control, packaging, telemetry, and
      reliability. Versions are evidence anchors, but the trend is organized
      by feature surface and capability evolution.
    why_watch: >
      Codex releases are a first-party window into how OpenAI is hardening the
      coding-agent runtime. Feature deltas show which control surfaces are
      becoming product primitives: profiles, goals, MCP environments, connector
      schemas, extension hooks, remote reliability, SDK auth, and packaging.
    include_keywords:
      - OpenAI Codex
      - Codex CLI
      - Codex release
      - Codex releases
      - openai/codex
      - rust-v
      - rust-v0.
      - codex 0.
