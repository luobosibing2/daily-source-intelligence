topics:
  - id: llm
    label: LLM / Frontier Models
    keywords:
      - LLM
      - large language model
      - foundation model
      - GPT
      - Claude
      - Gemini
      - model release
      - benchmark
    exclude:
      - beginner tutorial
      - prompt list

  - id: ai-agent
    label: AI Agent / Agentic Workflow
    keywords:
      - AI agent
      - agentic
      - autonomous agent
      - multi-agent
      - tool use
      - memory
      - evaluation
      - MCP
    exclude:
      - travel agent
      - game agent

  - id: ai-coding
    label: AI Coding / Developer Tools
    keywords:
      - AI coding
      - coding agent
      - Claude Code
      - Codex
      - Cursor
      - IDE
      - code review
      - SWE-bench
    exclude:
      - coupon
      - course discount

  - id: ai-governance
    label: AI Governance / Public Legitimacy
    keywords:
      - AI governance
      - AI ethics
      - public trust
      - public legitimacy
      - frontier AI
      - AI policy
      - AI regulation
      - regulator
      - government
      - Vatican
      - Pope
      - encyclical
      - human dignity
      - societal impact
      - human rights
      - EU AI Act
      - NIST
      - OECD
    exclude:
      - generic politics without AI
      - generic ethics essay without AI lab or policy actor
