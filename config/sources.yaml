twitterapi_io:
  enabled: true
  env_key: TWITTERAPI_IO_KEY
  base_url: https://api.twitterapi.io
  mode: user_last_tweets
  include_replies: false
  window_hours: 36
  max_workers: 5
  request_interval_seconds: 0
  output: twitterapi-io-results.json
  note: If TWITTERAPI_IO_KEY is not set, skip this provider and do not treat it as "no tweets".
